name: Prompt evaluator offline checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Avoid paying for obsolete offline checks on rapid successive PR updates.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository and frozen revisions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up deterministic Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Run offline unit tests and syntax checks
        run: |
          python3 --version
          python3 -m unittest -v test_eval_runner.py test_salvage_gate.py test_library_check.py
          python3 -m py_compile eval_runner.py test_eval_runner.py library_check.py test_salvage_gate.py test_library_check.py 09_失败算法项目挽救与转向/salvage_gate.py
          python3 library_check.py
          python3 -m json.tool EVAL_CASES.json > /dev/null
          python3 -m json.tool EVAL_CASES_CURRENT.json > /dev/null
          python3 -m json.tool LIBRARY_INDEX.json > /dev/null

      - name: Verify pilot and full fixture plans without model calls
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import sys
          from collections import Counter
          from pathlib import Path

          fixture = json.loads(Path("EVAL_CASES.json").read_text(encoding="utf-8"))
          all_ids = sorted(c["id"] for c in fixture["cases"])
          pilot_ids = fixture["pilot_ids"]
          assert pilot_ids and all_ids, "Missing evaluation fixtures"

          for label, selected, flags in (
              ("pilot", pilot_ids, []),
              ("all", all_ids, ["--all", "--allow-unchanged-controls"]),
          ):
              directory = Path(".eval_runs") / ("ci-" + label)
              budget = 2 * len(selected)  # one baseline and one candidate per case
              subprocess.run([
                  sys.executable, "eval_runner.py", "--max-calls", str(budget),
                  "--output-dir", str(directory), *flags
              ], check=True)
              manifest = json.loads((directory / "manifest.json").read_text(encoding="utf-8"))
              plan = json.loads((directory / "plan.json").read_text(encoding="utf-8"))

              assert manifest["status"] == "PLAN_ONLY", manifest
              assert manifest["actual_calls"] == 0
              assert manifest["planned_calls"] == budget == len(plan)
              assert manifest["selected_cases"] == selected
              assert len(set(selected)) == len(selected)
              assert manifest["base_ref"] != manifest["candidate_ref"]
              assert set(manifest["unchanged_control_cases"]) <= set(selected)
              assert all(len(j["prompt_sha256"]) == 64 for j in plan)
              assert Counter((j["case_id"], j["version"], j["repeat"]) for j in plan) == Counter(
                  (case_id, version, 1) for case_id in selected
                  for version in ("baseline", "candidate")
              )
              assert not (directory / "raw_responses.jsonl").exists()
              assert not (directory / "blind_review.csv").exists()
              print(f"OFFLINE_PLAN_PASS: {label}, {len(selected)} cases, {budget} planned, 0 model calls")
          PY

      - name: Verify current stress suite offline
        run: |
          python3 - <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          old="35f2b30f8541285430d7285aa414c236ce6ffc98"
          head=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          fixture=json.loads(Path("EVAL_CASES_CURRENT.json").read_text(encoding="utf-8"))
          chosen=fixture["pilot_ids"]
          subprocess.run([sys.executable,"eval_runner.py","--suite","current",
                          "--base-ref",old,"--candidate-ref",head,
                          "--output-dir",".eval_runs/ci-current",
                          "--max-calls",str(2*len(chosen))],check=True)
          m=json.loads(Path(".eval_runs/ci-current/manifest.json").read_text(encoding="utf-8"))
          assert m["status"]=="PLAN_ONLY" and m["actual_calls"]==0
          assert m["suite"]=="current" and m["fixture_file"]=="EVAL_CASES_CURRENT.json"
          assert m["selected_cases"]==chosen
          print("CURRENT_STRESS_PLAN_PASS",len(chosen),"scenarios")
          PY

      - name: Verify all 24 research scene prompts can be extracted
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          import eval_runner
          root=Path(".").resolve()
          sha=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          folder="08_算法检验与优化/高水平计算机论文工作流"
          counts={1:4,2:5,3:6,4:4,5:5}
          for stage,count in counts.items():
              path=f"{folder}/{stage:02d}_"+{
                  1:"科学选题与跨AI审核.md",2:"最小科学验证与决策.md",
                  3:"完整算法研发与正式实验.md",4:"独立科学验证.md",
                  5:"论文撰写与投稿.md"}[stage]
              for j in range(count):
                  key=f"{stage:02d}-{chr(ord('A')+j)}"
                  text=eval_runner.prompt(root,sha,path,key)
                  assert len(text)>100,(key,len(text))
          print("SCENARIO_EXTRACTION_PASS: 24/24; no model calls")
          PY
